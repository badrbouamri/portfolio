    max-width: 560px;
    border: 1px solid var(--rule);

  h1 {
    margin: 0 0 8px;
    font-size: 25px;
    letter-spacing: -0.01em;

  p.role {
    margin: 0 0 24px;
    color: var(--graphite);
    font-size: 16px;
  }
  p.note {
    margin: 0;
    color: var(--steel);
    font-size: 14px;
    font-family: ui-monospace, "IBM Plex Mono", monospace;
  }
  a {
    color: var(--accent);
  }
