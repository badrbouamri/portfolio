<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleRe descRe">
  <title id="titleRe">Limite d'élasticité de l'AISI 304H : ambiante vs température de service</title>
  <desc id="descRe">Diagramme en barres : 205 MPa à 25 °C, environ 200 MPa à 650 °C (température de service retenue pour le dimensionnement).</desc>
  <rect width="1200" height="700" fill="#ffffff" />

  <line x1="220" y1="80" x2="220" y2="520" stroke="#dce0e3" stroke-width="2" />
  <line x1="220" y1="520" x2="900" y2="520" stroke="#dce0e3" stroke-width="2" />

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#626d77">
    <line x1="220" y1="520" x2="900" y2="520" stroke="#dce0e3" stroke-width="1" />
    <text x="200" y="525" text-anchor="end">0</text>
    <line x1="220" y1="420" x2="900" y2="420" stroke="#dce0e3" stroke-width="1" />
    <text x="200" y="425" text-anchor="end">50</text>
    <line x1="220" y1="320" x2="900" y2="320" stroke="#dce0e3" stroke-width="1" />
    <text x="200" y="325" text-anchor="end">100</text>
    <line x1="220" y1="220" x2="900" y2="220" stroke="#dce0e3" stroke-width="1" />
    <text x="200" y="225" text-anchor="end">150</text>
    <line x1="220" y1="120" x2="900" y2="120" stroke="#dce0e3" stroke-width="1" />
    <text x="200" y="125" text-anchor="end">200</text>
    <text x="150" y="300" text-anchor="middle" transform="rotate(-90 150 300)" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#626d77">MPa</text>
  </g>

  <!-- baseline y=520, scale 2px per MPa -->
  <!-- 25°C: 205 MPa -->
  <rect x="330" y="110" width="160" height="410" fill="#0b5563" />
  <text x="410" y="90" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" fill="#14181b">205 MPa</text>
  <text x="410" y="550" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#14181b">25 °C (ambiante)</text>
  <text x="410" y="574" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#626d77">valeur fournisseur matériau</text>

  <!-- 650°C: ~200 MPa -->
  <rect x="630" y="120" width="160" height="400" fill="#9c5e00" />
  <text x="710" y="100" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" fill="#14181b">≈ 200 MPa</text>
  <text x="710" y="550" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#14181b">650 °C (service)</text>
  <text x="710" y="574" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#626d77">retenue pour le calcul ABAQUS</text>

  <text x="220" y="40" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="600" fill="#14181b">Limite d'élasticité AISI 304H — ambiante vs température de service</text>
  <text x="220" y="640" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#626d77">Sert de seuil de comparaison à la contrainte de Von Mises simulée sous ABAQUS — redessiné à partir des données matériau retenues pour l'étude.</text>
</svg>
